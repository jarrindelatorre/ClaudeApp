name: Agente de noticias

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede atrasarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: agente-noticias
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recopilar noticias y enviar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente.py
      - name: Guardar tablero y memoria de envíos
        run: |
          git config user.name "agente-noticias"
          git config user.email "agente-noticias@users.noreply.github.com"
          git add docs/noticias.json data/enviadas.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Actualizar noticias"
          git push
