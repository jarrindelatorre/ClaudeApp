<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño · serie Pública ───────────── */
      :root {
        --navy: #172d4c;
        --yellow: #f4ba1a;
        --text: #f4f1ec;
        --text-2: #a9b8c8;
        --font-big: "Oswald", "Archivo", sans-serif;
        --font-display: "Archivo", "Inter", system-ui, sans-serif;
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px;
      }
      @font-face {
        font-family: "Oswald";
        src: url("assets/fonts/oswald-700.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(90deg, rgba(14, 30, 52, 0.9) 0%, rgba(14, 30, 52, 0.62) 50%, rgba(14, 30, 52, 0.4) 100%);
      }
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 104px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--yellow);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--yellow);
        transform-origin: left center;
      }
      #layer-copy {
        z-index: 2;
      }

      /* Texto: JUNTOS (Oswald, amarillo, grande) + con Pública FM (blanco, más pequeño) */
      .left {
        position: absolute;
        left: var(--margin);
        top: 0;
        height: 1080px;
        width: 760px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .line-wrap {
        overflow: hidden;
      }
      .line-wrap > * {
        display: block;
      }
      #brand {
        color: var(--text);
        font: 600 110px/1 var(--font-display);
        font-stretch: 118%;
        letter-spacing: 0.02em;
      }
      .label {
        margin-top: 14px;
        color: var(--text);
        font: 500 36px/1.3 var(--font-body);
      }
      .rest {
        max-width: 640px;
        margin-top: 8px;
        color: var(--text);
        font: 600 44px/1.18 var(--font-display);
        font-stretch: 105%;
      }
      #juntos {
        color: var(--yellow);
        font: 700 230px/0.95 var(--font-big);
        letter-spacing: 0.01em;
        text-transform: uppercase;
        transform-origin: left bottom;
      }
      #con-old {
        margin-top: 10px;
        color: var(--text);
        font: 600 64px/1.1 var(--font-display);
        font-stretch: 110%;
      }
      .rule-under {
        margin-top: 34px;
        width: 220px;
        height: 3px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Collage de fotos que se apilan */
      .card {
        position: absolute;
      }
      .card .mask {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 4px;
        border: 6px solid #f4f1ec;
        box-shadow: 0 34px 80px rgba(0, 10, 25, 0.6), 0 6px 18px rgba(0, 10, 25, 0.4);
        background: #0e1e34;
      }
      .card img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #card-a {
        left: 900px;
        top: 140px;
        width: 720px;
        height: 409px;
        z-index: 1;
      }
      #card-b {
        left: 960px;
        top: 560px;
        width: 620px;
        height: 348px;
        z-index: 2;
      }
      #card-c {
        left: 1330px;
        top: 360px;
        width: 500px;
        height: 297px;
        z-index: 3;
      }

      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 25, 0.5) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.06;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div id="layer-bg" class="layer">
          <div class="bgl"><img src="assets/fondo-publica.png" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="layer-photos" class="layer">
          <svg id="radio" viewBox="0 0 900 900" style="position:absolute;left:960px;top:90px;width:900px;height:900px;overflow:visible"></svg>
        </div>

        <div id="layer-copy" class="layer">
          <div class="kicker"><span class="num">01 · Historia</span><span class="rule"></span></div>
          <div class="left">
            <div class="line-wrap"><span id="brand">Pública FM</span></div>
            <div class="label" id="lbl">acompaña al Ecuador desde</div>
            <div class="line-wrap"><span id="juntos">2008</span></div>
            <div class="rule-under" id="rule-under"></div>
          </div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      const DUR = 25; // duración total
      const ANIM = 10; // la animación principal ocurre en los primeros 10 s
      const EASE = "expo.out";
      const tl = gsap.timeline({ paused: true });

      /* Parallax */
      tl.fromTo(".bgl img", { scale: 1.1, x: 60, y: 0 }, { scale: 1, x: -80, y: -60, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#layer-copy", { x: -160, y: 20, rotation: -0.8 }, { x: 0, y: 0, rotation: 0, duration: 2.0, ease: EASE }, 0);
      tl.fromTo("#layer-photos", { x: -200 }, { x: 0, duration: 2.6, ease: "power4.out" }, 0.2);
      tl.fromTo(".left", { x: 0, y: 0 }, { x: -24, y: -10, duration: DUR, ease: "sine.inOut" }, 0);

      /* Texto */
      tl.fromTo(".kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.3);
      tl.fromTo(".kicker .num", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 1.0, ease: EASE }, 0.4);
      tl.fromTo("#brand", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.4, ease: EASE }, 0.6);
      tl.fromTo("#lbl", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: EASE }, 1.3);
      tl.fromTo("#juntos", { yPercent: 110, rotation: 4, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.6, ease: EASE }, 1.7);
      tl.fromTo("#rule-under", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 3.4);
      tl.fromTo("#juntos", { scale: 1 }, { scale: 1.04, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 8.2);

      /* Ondas de radio y ecualizador (en vez de fotos) */
      const NS = "http://www.w3.org/2000/svg";
      const R = document.getElementById("radio");
      const mk = (tag, at) => { const n = document.createElementNS(NS, tag); for (const k in at) n.setAttribute(k, at[k]); R.appendChild(n); return n; };
      const CX = 450, CY = 430;
      // Ondas concéntricas que se emiten desde el centro, en bucle durante todo el video
      const COLORS = ["#f4ba1a", "#5fbcb5", "#3a8fc4"];
      for (let i = 0; i < 6; i++) {
        const c = mk("circle", { cx: CX, cy: CY, r: 60, fill: "none", stroke: COLORS[i % 3], "stroke-width": 10, class: "ring" });
        tl.fromTo(c, { attr: { r: 70 }, opacity: 0.9 }, { attr: { r: 430 }, opacity: 0, duration: 4.2, ease: "power1.out", repeat: 5, immediateRender: false }, 1.0 + i * 0.7);
        tl.set(c, { opacity: 0 }, 0);
      }
      // Ecualizador: barras que suben y bajan (patrón fijo, determinista)
      const NB = 15, BW = 26, GAP = 14, BASE = CY + 40;
      const x0 = CX - (NB * BW + (NB - 1) * GAP) / 2;
      mk("circle", { cx: CX, cy: CY, r: 190, fill: "rgba(14,30,52,0.75)", stroke: "rgba(244,186,26,0.5)", "stroke-width": 3, id: "disc" });
      for (let i = 0; i < NB; i++) {
        const bar = mk("rect", { x: x0 + i * (BW + GAP), y: BASE - 160, width: BW, height: 160, rx: 13, fill: i % 4 === 0 ? "#5fbcb5" : "#f4ba1a", class: "bar" });
        const peak = 0.35 + 0.6 * Math.abs(Math.sin(i * 1.7));
        tl.fromTo(bar, { scaleY: 0.08, transformOrigin: "50% 100%" }, { scaleY: peak, duration: 0.42 + (i % 5) * 0.07, ease: "sine.inOut", yoyo: true, repeat: 40, immediateRender: false }, 1.2 + (i % 7) * 0.06);
        tl.set(bar, { scaleY: 0.08, transformOrigin: "50% 100%" }, 0);
      }
      mk("text", { x: CX, y: BASE + 70, "text-anchor": "middle", fill: "#f4f1ec", style: "font: 700 34px Inter; letter-spacing: 0.28em", id: "onair" }).textContent = "AL AIRE";
      tl.fromTo("#disc", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 1.2, ease: "back.out(1.6)" }, 0.6);
      tl.fromTo("#onair", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: EASE }, 1.6);
      tl.fromTo("#onair", { opacity: 1 }, { opacity: 0.35, duration: 0.8, yoyo: true, repeat: 13, ease: "sine.inOut", immediateRender: false }, 3);
      tl.to("#radio", { y: -16, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
