<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño · serie Pública ───────────── */
      :root {
        --navy: #172d4c;
        --blue: #3a8fc4;
        --blue-dark: #2c6f9c;
        --teal: #5fbcb5;
        --yellow: #f4ba1a;
        --text: #f4f1ec;
        --text-2: #a9b8c8;
        --grid: rgba(244, 241, 236, 0.1);
        --font-display: "Archivo", "Inter", system-ui, sans-serif;
        --display-stretch: 118%;
        --display-weight: 600;
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* Fondo de ondas (capa más lenta), oscurecido para que los gráficos se lean bien */
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(180deg, rgba(14, 30, 52, 0.8) 0%, rgba(14, 30, 52, 0.7) 100%);
      }

      /* Encabezado */
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 84px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--yellow);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Frase: Nació en Guayaquil, se tomó el Ecuador y se proyecta al mundo */
      .headline {
        position: absolute;
        left: var(--margin);
        top: 128px;
        width: 1680px;
      }
      .line-wrap {
        overflow: hidden;
        padding-bottom: 4px;
      }
      .hl {
        display: block;
        color: var(--text);
        font: var(--display-weight) 54px / 1.12 var(--font-display);
        font-stretch: 108%;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .hl b {
        color: var(--yellow);
        font-weight: inherit;
      }

      /* Tarjetas de gráficos */
      .panel {
        position: absolute;
        top: 288px;
        width: 820px;
        height: 750px;
        border-radius: 10px;
        background: rgba(14, 30, 52, 0.86);
        border: 1px solid rgba(244, 241, 236, 0.1);
        box-shadow: 0 30px 70px rgba(0, 8, 20, 0.45);
        overflow: hidden;
      }
      #panel-a {
        left: var(--margin);
        width: 740px;
      }
      #panel-b {
        left: 900px;
        width: 900px;
      }
      .panel svg {
        position: absolute;
        inset: 0;
        height: 690px;
        overflow: visible;
      }
      .c-title {
        fill: var(--text);
        font: 700 27px var(--font-body);
      }
      .c-sub {
        fill: var(--text-2);
        font: 400 17px var(--font-body);
      }
      .c-legend {
        fill: var(--text);
        font: 500 16px var(--font-body);
      }
      .c-axis {
        fill: var(--text-2);
        font: 500 15px var(--font-body);
      }
      .c-year {
        fill: var(--text);
        font: 700 19px var(--font-body);
      }
      .c-note {
        fill: var(--text-2);
        font: 400 14px var(--font-body);
      }
      .c-total {
        fill: var(--text);
        font: 700 21px var(--font-body);
        font-variant-numeric: tabular-nums;
      }
      .c-inc {
        fill: var(--text);
        font: 600 14px var(--font-body);
      }
      .c-pt {
        font: 600 14px var(--font-body);
        font-variant-numeric: tabular-nums;
      }
      .c-end {
        font: 700 30px var(--font-body);
        font-variant-numeric: tabular-nums;
      }
      .c-name {
        font: 700 28px var(--font-body);
      }
      .c-badge {
        fill: var(--text);
        font: 700 18px var(--font-body);
      }
      .c-head {
        fill: var(--text-2);
        font: 600 14px var(--font-body);
        letter-spacing: 0.12em;
      }
      .c-region {
        font: 700 15px var(--font-body);
        letter-spacing: 0.16em;
      }
      .c-city {
        fill: var(--text);
        font: 600 19px var(--font-body);
      }
      .c-mult {
        fill: #f4ba1a;
        font: 700 14px var(--font-body);
      }
      .c-medal {
        font: 800 17px var(--font-body);
      }
      .c-end-name {
        fill: var(--text-2);
        font: 500 16px var(--font-body);
      }

      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 60%, rgba(0, 10, 25, 0.45) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.06;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div id="layer-bg" class="layer">
          <div class="bgl"><img src="assets/fondo-publica.png" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="layer-copy" class="layer">
          <div class="kicker"><span class="num">02 · Ranking</span><span class="rule"></span></div>
          <div class="headline">
            <div class="line-wrap"><span class="hl" id="h1"><b>Primeros lugares</b> en noticias,</span></div>
            <div class="line-wrap"><span class="hl" id="h2">deportes y música</span></div>
          </div>
        </div>

        <div id="layer-charts" class="layer">
          <div class="panel" id="panel-a"><svg id="chart-a" viewBox="0 0 740 750" style="width: 740px; height: 750px"></svg></div>
          <div class="panel" id="panel-b"><svg id="chart-b" viewBox="0 0 900 750" style="width: 900px; height: 750px"></svg></div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      /* ───────────── Datos (editables) ───────────── */
      const YEARS = ["2024", "2025", "2026"];
      const SERIES = [
        { name: "Guayaquil", color: "#5fbcb5", ranks: [25, 18, 19], below: false },
        { name: "Quito", color: "#3a8fc4", ranks: [33, 29, 27], below: true },
      ];

      /* ───────────── Utilidades ───────────── */
      const NS = "http://www.w3.org/2000/svg";
      const svgEl = (parent, tag, attrs = {}, text) => {
        const n = document.createElementNS(NS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        if (text != null) n.textContent = text;
        parent.appendChild(n);
        return n;
      };

      /* ───────────── Gráfico · evolución del ranking (eje invertido) ───────────── */
      const A = document.getElementById("chart-a");
      svgEl(A, "text", { x: 40, y: 64, class: "c-title" }, "Evolución del ranking 2024 – 2026");
      svgEl(A, "text", { x: 40, y: 96, class: "c-sub" }, "Eje invertido: cuanto más arriba, mejor posición");
      SERIES.forEach((s, k) => {
        const x = 470 + k * 140;
        svgEl(A, "circle", { cx: x, cy: 132, r: 8, fill: s.color });
        svgEl(A, "text", { x: x + 16, y: 138, class: "c-legend" }, s.name);
      });
      const X0 = 120, X1 = 470, Y0 = 640, Y1 = 200, RMIN = 15, RMAX = 35;
      const px = (i) => X0 + (i / (YEARS.length - 1)) * (X1 - X0);
      const py = (r) => Y1 + ((r - RMIN) / (RMAX - RMIN)) * (Y0 - Y1);
      svgEl(A, "text", { x: 40, y: 172, class: "c-legend", style: "fill:#5fbcb5" }, "▲ Mejor");
      // Columna destacada del año actual
      const hl = svgEl(A, "rect", { id: "hl-col", x: px(2) - 50, y: Y1 - 20, width: 100, height: Y0 - Y1 + 40, rx: 14, fill: "rgba(244,186,26,0.1)" });
      for (let r = RMIN; r <= RMAX; r += 5) {
        svgEl(A, "line", { x1: X0 - 30, x2: X1 + 40, y1: py(r), y2: py(r), stroke: "rgba(244,241,236,0.1)", "stroke-width": 1 });
        svgEl(A, "text", { x: 74, y: py(r) + 5, class: "c-axis", "text-anchor": "end" }, `#${r}`);
      }
      YEARS.forEach((y, i) =>
        svgEl(A, "text", { x: px(i), y: Y0 + 50, class: "c-year", "text-anchor": "middle", fill: i === 2 ? "#f4ba1a" : null, style: i === 2 ? "fill:#f4ba1a" : "" }, y)
      );
      const defs = svgEl(A, "defs");
      svgEl(svgEl(defs, "clipPath", { id: "reveal" }), "rect", { id: "reveal-rect", x: X0 - 20, y: 0, width: 0, height: 690 });
      const plot = svgEl(A, "g", { "clip-path": "url(#reveal)" });
      SERIES.forEach((s, k) => {
        const pts = s.ranks.map((r, i) => `${px(i)},${py(r)}`).join(" ");
        svgEl(plot, "polyline", { points: pts, fill: "none", stroke: s.color, "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round" });
        s.ranks.forEach((r, i) => {
          const g = svgEl(A, "g", { class: `dot dot-${i}` });
          const last = i === 2;
          svgEl(g, "circle", { cx: px(i), cy: py(r), r: last ? 13 : 11, fill: last ? s.color : "#0e1e34", stroke: last ? "#0e1e34" : s.color, "stroke-width": last ? 3 : 5 });
          const dy = s.below ? 42 : -22;
          svgEl(g, "text", { x: px(i), y: py(r) + dy, class: last ? "c-end" : "c-total", "text-anchor": "middle", style: last ? `fill:${s.color}` : "" }, `#${r}`);
        });
        // Etiqueta final con mejora vs 2024
        const end = svgEl(A, "g", { class: "end", id: `end-${k}` });
        const yy = py(s.ranks[2]);
        svgEl(end, "text", { x: X1 + 74, y: yy - 6, class: "c-name", style: `fill:${s.color}` }, s.name);
        const gain = s.ranks[0] - s.ranks[2];
        const bx = X1 + 74;
        svgEl(end, "rect", { x: bx, y: yy + 8, width: 150, height: 38, rx: 19, fill: "rgba(244,186,26,0.18)", stroke: "rgba(244,186,26,0.5)" });
        svgEl(end, "text", { x: bx + 75, y: yy + 33, class: "c-badge", "text-anchor": "middle" }, `▲ ${gain} vs 2024`);
      });

      /* ───────────── Gráfico · mapa de podios por ciudad ───────────── */
      const PODIOS = [
        { region: "Litoral y Santo Domingo", color: "#5fbcb5", rows: [
          ["Santo Domingo", 1, [[1], [2], [], []]],
          ["Portoviejo – Manta", 2, [[1], [], [1], []]],
          ["Babahoyo – Quevedo", 1, [[2], [3], [1], [2]]],
          ["Guayaquil", 1, [[], [3], [], [1, 3]]],
          ["Machala", 0, [[], [2, 3], [2], []]],
        ] },
        { region: "Sierra", color: "#3a8fc4", rows: [
          ["Ibarra", 2, [[1], [1], [], []]],
          ["Quito", 1, [[1], [3], [], [2]]],
          ["Ambato", 1, [[1], [3], [], []]],
          ["Cuenca", 2, [[1], [1], [], [3]]],
        ] },
      ];
      const MEDAL = { 1: ["#e2b33c", "#1a1a1a"], 2: ["#aeb6c4", "#ffffff"], 3: ["#bf8a5f", "#ffffff"] };
      const Bc = document.getElementById("chart-b");
      svgEl(Bc, "text", { x: 40, y: 64, class: "c-title" }, "Mapa de podios por ciudad");
      svgEl(Bc, "text", { x: 40, y: 96, class: "c-sub" }, "Cada medalla es un programa en el top 3 de su franja horaria");
      [[1, "1.er lugar", 560], [2, "2.º", 690], [3, "3.º", 770]].forEach(([m, t, x]) => {
        svgEl(Bc, "circle", { cx: x, cy: 132, r: 10, fill: MEDAL[m][0] });
        svgEl(Bc, "text", { x: x + 18, y: 138, class: "c-legend" }, t);
      });
      const COLS = [420, 545, 675, 810];
      svgEl(Bc, "rect", { x: 30, y: 158, width: 840, height: 48, rx: 10, fill: "rgba(244,241,236,0.07)" });
      svgEl(Bc, "text", { x: 48, y: 188, class: "c-head" }, "CIUDAD");
      [["DEPORTES"], ["NOTICIAS"], ["MÚSICA", "ROMÁNTICA"], ["MÚSICA", "TROPICAL"]].forEach((h, c) =>
        h.forEach((t, j) => svgEl(Bc, "text", { x: COLS[c], y: h.length === 1 ? 188 : 178 + j * 18, class: "c-head", "text-anchor": "middle" }, t))
      );
      let yy = 238, rowN = 0;
      PODIOS.forEach((g) => {
        const sec = svgEl(Bc, "g", { class: "trow" });
        svgEl(sec, "rect", { x: 46, y: yy - 14, width: 4, height: 18, rx: 2, fill: g.color });
        svgEl(sec, "text", { x: 60, y: yy + 1, class: "c-region", style: `fill:${g.color}` }, g.region.toUpperCase());
        yy += 36;
        g.rows.forEach(([city, x, cells]) => {
          const r = svgEl(Bc, "g", { class: "trow", id: `trow-${rowN++}` });
          svgEl(r, "line", { x1: 30, x2: 870, y1: yy + 23, y2: yy + 23, stroke: "rgba(244,241,236,0.08)" });
          const name = svgEl(r, "text", { x: 48, y: yy + 7, class: "c-city" }, city);
          if (x) {
            const bx = 48 + city.length * 10.6 + 14;
            svgEl(r, "rect", { x: bx, y: yy - 13, width: 44, height: 26, rx: 13, fill: "rgba(244,186,26,0.18)" });
            svgEl(r, "text", { x: bx + 22, y: yy + 6, class: "c-mult", "text-anchor": "middle" }, `×${x}`);
          }
          cells.forEach((ms, c) => {
            if (!ms.length) return svgEl(r, "circle", { cx: COLS[c], cy: yy, r: 3, fill: "rgba(244,241,236,0.25)" });
            ms.forEach((m, k) => {
              const cx = COLS[c] + (k - (ms.length - 1) / 2) * 40;
              const md = svgEl(r, "g", { class: "medal" });
              svgEl(md, "circle", { cx, cy: yy, r: 18, fill: MEDAL[m][0], stroke: "rgba(255,255,255,0.35)", "stroke-width": 2 });
              svgEl(md, "text", { x: cx, y: yy + 7, class: "c-medal", "text-anchor": "middle", style: `fill:${MEDAL[m][1]}` }, m);
            });
          });
          yy += 44;
        });
        yy += 8;
      });

      /* ───────────── Animación ───────────── */
      const DUR = 25; // duración total
      const ANIM = 10; // la animación principal ocurre en los primeros 10 s
      const EASE = "expo.out";
      const tl = gsap.timeline({ paused: true });
      const lineIn = (t, at) => tl.fromTo(t, { yPercent: 110, rotation: 3, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.4, ease: EASE }, at);

      tl.fromTo(".bgl img", { scale: 1.1, x: 60, y: 0 }, { scale: 1, x: -80, y: -60, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#layer-copy", { x: -160 }, { x: 0, duration: 2.0, ease: EASE }, 0);
      tl.fromTo("#layer-copy", { y: 0 }, { y: -6, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo(".kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.3);
      tl.fromTo(".kicker .num", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 1.0, ease: EASE }, 0.4);
      lineIn("#h1", 0.6);
      lineIn("#h2", 1.1);

      tl.fromTo("#panel-a", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 1.4, ease: EASE }, 1.8);
      // Las líneas se revelan año a año; los puntos aparecen al paso
      const L0 = 3.2, LD = 4.4;
      tl.fromTo("#reveal-rect", { attr: { width: 0 } }, { attr: { width: X1 - X0 + 40 }, duration: LD, ease: "power1.inOut" }, L0);
      YEARS.forEach((_, i) =>
        tl.fromTo(`#chart-a .dot-${i}`, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, L0 + (i / 2) * LD * 0.95)
      );
      tl.fromTo("#hl-col", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 1.0, ease: "power3.out" }, L0 + LD - 0.6);
      tl.fromTo("#chart-a .end", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.9, ease: EASE, stagger: 0.25 }, L0 + LD);
      tl.fromTo("#chart-a .end rect", { scale: 0.6, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.7, ease: "back.out(2)", stagger: 0.25 }, L0 + LD + 0.3);

      // Tabla de podios: filas en cascada y medallas que aparecen con rebote
      tl.fromTo("#panel-b", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2, ease: EASE }, 6.6);
      tl.fromTo("#chart-b .trow", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: EASE, stagger: 0.2 }, 7.3);
      tl.fromTo("#chart-b .medal", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2.4)", stagger: 0.08 }, 7.6);

      tl.to("#panel-a", { y: -10, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);
      tl.to("#panel-b", { y: 8, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
