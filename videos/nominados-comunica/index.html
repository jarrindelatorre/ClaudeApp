<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Premios Comunica 2026 · Nominados · estilo dorado de cine ───────────── */
      :root {
        --cream: #f6ead0;
        --gold: #e8c46a;
        --gold-dark: #9a6618;
        --bg: #0b0805;
        --serif: "Cinzel", "Times New Roman", serif;
        --italic: "Cormorant Garamond", "Times New Roman", serif;
      }
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-900-normal.woff2") format("woff2"); font-weight: 900; font-display: block; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-600-italic.woff2") format("woff2"); font-weight: 600; font-style: italic; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--cream); }
      #stage, .scene, .layer { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .scene { visibility: hidden; }

      /* ── Ambiente: fondo, rayos, reflectores, polvo dorado ── */
      #bg { background: radial-gradient(ellipse at 50% 45%, #2a1d0c 0%, #140e06 45%, #050403 100%); }
      #rays {
        position: absolute; left: -340px; top: -760px; width: 2600px; height: 2600px;
        background: repeating-conic-gradient(from 0deg, rgba(232, 196, 106, 0.16) 0deg 4deg, rgba(232, 196, 106, 0) 4deg 12deg);
        -webkit-mask: radial-gradient(circle at 50% 50%, #000 0%, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
        mask: radial-gradient(circle at 50% 50%, #000 0%, rgba(0, 0, 0, 0.6) 25%, transparent 55%);
        opacity: 0.5;
      }
      .beam {
        position: absolute; bottom: -60px; width: 420px; height: 1500px; transform-origin: 50% 100%;
        background: linear-gradient(to top, rgba(255, 228, 160, 0.42), rgba(255, 228, 160, 0) 85%);
        clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0);
        mix-blend-mode: screen; filter: blur(6px);
      }
      #beam1 { left: 160px; }
      #beam2 { left: 1340px; }
      .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #ffe6a0; box-shadow: 0 0 8px 2px rgba(255, 210, 120, 0.7); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.75) 100%); }
      #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.08; mix-blend-mode: overlay; }
      #frame { position: absolute; inset: 22px; border: 2px solid rgba(232, 196, 106, 0.35); outline: 1px solid rgba(232, 196, 106, 0.18); outline-offset: 8px; }

      /* ── Texto dorado con brillo que barre ── */
      .gold {
        --sx: 160%;
        background: linear-gradient(105deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.95) 50%, rgba(255, 255, 255, 0) 58%) var(--sx) 0 / 300% 100% no-repeat,
          linear-gradient(180deg, #fff4c8 0%, #f3d27c 30%, #c48a2c 52%, #f6dd98 70%, #a06c1c 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 3px 0 #4a2f06) drop-shadow(0 14px 26px rgba(0, 0, 0, 0.7));
        padding-top: 0.14em; /* espacio para tildes de mayúsculas (Ñ, Á…) dentro del recorte del degradado */
      }
      .cream { color: var(--cream); text-shadow: 0 6px 20px rgba(0, 0, 0, 0.7); }
      .cin { font-family: var(--serif); font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.02; }
      .ita { font-family: var(--italic); font-style: italic; font-weight: 600; }
      .block { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .block > div { white-space: nowrap; }
      .rule { width: 520px; height: 2px; margin: 22px 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

      /* ── Logo ── */
      .statue { position: absolute; transform-origin: 50% 100%; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.6)) brightness(1.05); }
      .statue img { display: block; width: 100%; height: 100%; }

      /* ── Categorías ── */
      .catblock { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform-origin: 50% 0; }
      .catblock .lab { font: 700 34px/1 var(--serif); letter-spacing: 0.5em; padding-left: 0.5em; color: var(--gold); }
      .catblock .nm { margin-top: 18px; white-space: nowrap; }
      .catblock .ds { margin-top: 14px; font-size: 56px; color: var(--cream); white-space: nowrap; }
      .nom { position: absolute; top: 330px; width: 560px; text-align: center; }
      .nom.l { left: 260px; }
      .nom.r { left: 1100px; }
      .ph { position: relative; width: 430px; height: 430px; margin: 0 auto; border-radius: 50%; padding: 12px;
        background: conic-gradient(from 210deg, #fff1bd, #c48a2c, #f6dd98, #8a5a14, #fff1bd, #c48a2c, #fff1bd);
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.6), 0 26px 60px rgba(0, 0, 0, 0.7), 0 0 60px rgba(232, 196, 106, 0.25); }
      .ph .in { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 5px solid #1a1208; }
      .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .ph .in::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 38%, rgba(0, 0, 0, 0) 55%, rgba(20, 12, 4, 0.55) 100%); }
      .nom .name { margin-top: 26px; font: 700 46px/1.1 var(--serif); letter-spacing: 0.04em; color: var(--cream); white-space: nowrap; text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8); }

      /* ── QR siempre presente (abajo al centro) ── */
      #qrmini { position: absolute; left: 860px; top: 862px; width: 200px; text-align: center; visibility: hidden; }
      .qrbox { width: 200px; height: 200px; padding: 9px; background: linear-gradient(180deg, #fff1bd, #c48a2c 55%, #f6dd98); border-radius: 10px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7); }
      .qrbox img { display: block; width: 100%; height: 100%; border-radius: 4px; image-rendering: pixelated; }
      #qrmini .vota { position: absolute; left: -60px; top: -44px; width: 320px; font: 900 30px/1 var(--serif); letter-spacing: 0.18em; padding-left: 0.18em; color: #fff1bd; text-shadow: 0 0 14px rgba(232, 196, 106, 0.8), 0 3px 8px #000; }
      #qrbig { position: absolute; left: 670px; top: 250px; width: 580px; }
      #qrbig .qrbox { width: 580px; height: 580px; padding: 22px; border-radius: 22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="121" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="121" data-track-index="0">
        <div class="layer" id="bg"></div>
        <div id="rays"></div>
        <div class="beam" id="beam1"></div>
        <div class="beam" id="beam2"></div>
        <div class="layer" id="dustl"></div>

        <!-- DP1 · Intro -->
        <div class="scene" id="s1">
          <div class="block" id="b1">
            <div class="gold cin" style="font-size: 132px">Mucho talento,</div>
            <div class="cream ita" style="font-size: 76px; margin-top: 6px">poco presupuesto.</div>
            <div class="rule"></div>
            <div class="cream cin" style="font-size: 58px; letter-spacing: 0.2em">Por fin,</div>
            <div class="gold cin" style="font-size: 132px">un premio</div>
          </div>
          <div class="block" id="b2"><div class="gold cin" style="font-size: 230px; letter-spacing: 0.08em">Llega</div></div>
          <div class="layer" id="logo"></div>
        </div>

        <!-- DP2 · Encuesta -->
        <div class="scene" id="s2">
          <div class="block" id="b3">
            <div class="cream ita" style="font-size: 84px">Estos fueron</div>
            <div class="gold cin" style="font-size: 132px; margin-top: 4px">los más nominados</div>
          </div>
          <div class="block" id="b4" style="padding-bottom: 160px">
            <div class="cream cin" style="font-size: 60px; letter-spacing: 0.3em">Los</div>
            <div class="gold cin" style="font-size: 170px">Nominados</div>
            <div class="cream cin" style="font-size: 60px; letter-spacing: 0.3em">son</div>
          </div>
        </div>

        <div id="cats"></div>
        <div class="layer" id="statues"></div>

        <!-- QR permanente -->
        <div id="qrmini">
          <div class="qrbox"><img src="assets/qr-encuesta.png" alt="" /></div>
          <div class="vota">VOTA AQUÍ</div>
        </div>

        <!-- Cierre: QR grande 15 s -->
        <div class="scene" id="s-fin">
          <div class="block" style="justify-content: flex-start; padding-top: 70px">
            <div class="gold cin" id="fin-t" style="font-size: 104px">¡Vota aquí!</div>
          </div>
          <div id="qrbig"><div class="qrbox"><img src="assets/qr-encuesta.png" alt="" /></div></div>
          <div class="block" style="justify-content: flex-end; padding-bottom: 92px">
            <div class="cream cin" id="fin-s" style="font-size: 40px; letter-spacing: 0.32em">Premios Comunica 2026</div>
          </div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
        <div id="frame"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
      const show = (sel, a, b) => { tl.set(sel, { visibility: "visible" }, a); if (b != null) tl.set(sel, { visibility: "hidden" }, b); };
      // bloque de texto: entra completo, legible de inmediato
      const blockIn = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, at);
      const blockOut = (sel, at) => tl.to(sel, { opacity: 0, scale: 0.94, duration: 0.45, ease: "power2.in" }, at);
      const shine = (sel, at) => tl.fromTo(sel, { "--sx": "160%" }, { "--sx": "-60%", duration: 1.3, ease: "power1.inOut", stagger: 0.12 }, at);

      /* Tiempos: intro 10 s · encuesta 8 s · 11 categorías × 8 s · QR final 15 s */
      const T2 = 10, TC = 18, CD = 8, TF = TC + 11 * CD, DUR = TF + 15;

      /* ───── Ambiente ───── */
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 40, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#beam1", { rotation: -28 }, { rotation: 14, duration: 6, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 6) - 1 }, 0);
      tl.fromTo("#beam2", { rotation: 28 }, { rotation: -14, duration: 7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 7) - 1 }, 0);
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < 70; i++) {
        const d = el("div", "dust");
        Object.assign(d.style, { left: rnd() * 1920 + "px", top: 200 + rnd() * 1000 + "px", opacity: 0.2 + rnd() * 0.7, transform: `scale(${0.5 + rnd() * 1.2})` });
        $("dustl").appendChild(d);
        tl.fromTo(d, { y: 0, x: 0 }, { y: -(300 + rnd() * 700), x: (rnd() - 0.5) * 200, duration: DUR, ease: "none" }, 0);
      }

      /* ───── Estatuas (se turnan) ───── */
      const FIG = [
        { src: "fig-1.png", w: 330, h: 726, bx: 207 },
        { src: "fig-2.png", w: 365, h: 770, bx: 205.5 },
        { src: "fig-3.png", w: 369, h: 734, bx: 165 },
      ];
      const statue = (host, k, baseX, floorY, H) => {
        const f = FIG[k], K = H / f.h, w = f.w * K, cx = baseX - (f.bx - f.w / 2) * K;
        const e = el("div", "statue", `<img src="assets/${f.src}" alt="" />`);
        Object.assign(e.style, { left: cx - w / 2 + "px", top: floorY - H + "px", width: w + "px", height: H + "px" });
        host.appendChild(e);
        return e;
      };
      const land = (e, at, from = -1200) => {
        tl.fromTo(e, { y: from }, { y: 0, duration: 0.6, ease: "power3.in" }, at);
        tl.fromTo(e, { scaleY: 1, scaleX: 1 }, { scaleY: 0.9, scaleX: 1.07, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at + 0.6);
      };

      /* ───── DP1 · Intro (0–10 s) ───── */
      show("#s1", 0, T2);
      blockIn("#b1", 0.4);
      shine("#b1 .gold", 1.4);
      blockOut("#b1", 4.0);
      tl.fromTo("#b2", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power4.out" }, 4.5);
      shine("#b2 .gold", 4.9);
      blockOut("#b2", 5.6);
      // Logo: tres estatuas caen en fila y aparece el nombre
      const logo = $("logo");
      const st = [statue(logo, 0, 760, 560, 330), statue(logo, 1, 960, 560, 360), statue(logo, 2, 1160, 560, 330)];
      st.forEach((e, i) => land(e, 6.0 + i * 0.25));
      const lt = el("div", "block", `<div class="cream cin" style="font-size:44px;letter-spacing:0.5em;padding-left:0.5em">Premios</div><div class="gold cin" style="font-size:150px">Comunica</div><div class="gold cin" style="font-size:84px;letter-spacing:0.3em;padding-left:0.3em">2026</div>`);
      lt.style.paddingTop = "560px";
      logo.appendChild(lt);
      blockIn(lt, 7.0);
      shine(lt.querySelectorAll(".gold"), 7.8);
      tl.to("#s1", { opacity: 0, duration: 0.4 }, T2 - 0.4);

      /* ───── DP2 · Encuesta (10–18 s) ───── */
      show("#s2", T2, TC);
      blockIn("#b3", T2 + 0.3);
      shine("#b3 .gold", T2 + 1.2);
      blockOut("#b3", T2 + 4.2);
      blockIn("#b4", T2 + 4.7);
      shine("#b4 .gold", T2 + 5.3);
      tl.to("#s2", { opacity: 0, duration: 0.4 }, TC - 0.4);
      // QR siempre presente desde aquí hasta el cierre
      show("#qrmini", TC + 0.4, TF);
      tl.fromTo("#qrmini", { y: 300 }, { y: 0, duration: 0.9, ease: "back.out(1.4)" }, TC + 0.4);
      tl.fromTo("#qrmini .vota", { scale: 1 }, { scale: 1.12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, TC + 1.4);

      /* ───── DP3–DP13 · Categorías: primero el título, luego los nominados ───── */
      const CATS = [
        ["Google Humano", "el que sabe y encuentra todo", 1, 2, "Alexandra Mazón", "Paola Mantilla"],
        ["Soltero(a) del año", "", 3, 4, "Mildred Mantilla", "Guillermo Barrera"],
        ["MacGyver", "el que siempre resuelve", 5, 6, "Emerson Basantes", "Daniel Galarza"],
        ["Se me fue el bus", "el que siempre llega tarde", 7, 8, "Juan Pablo Martínez", "José Luis Gualotuña"],
        ["El último en apagar la luz", "el que siempre se queda hasta el último", 9, 10, "Santiago Vivanco", "Daniel Bastidas"],
        ["Apagafuegos oficial", "el que sabe cómo resolver las cosas", 11, 12, "Grace Cordero", "Freddy Rivera"],
        ["El alma de la empresa", "", 13, 14, "Estefanía Garrido", "Gabriela González"],
        ["El Panasutra del año", "el que más come pan", 15, 16, "Nelson Sánchez", "Pablo Cando"],
        ["El Grinch de la oficina", "", 17, 18, "Javier Izquierdo", "María Fernanda Calvopiña"],
        ["El altavoz de la oficina", "el que siempre tiene un tema de conversación", 19, 20, "Rodrigo Martínez", "Sofía Vintimilla"],
        ["El sobreviviente", "el más accidentado/a", 21, 22, "Byron Espinosa", "Carolina Calderón"],
      ];
      const FOTOS = ["alexandra-mazon", "paola-mantilla", "mildred-mantilla", "guillermo-barrera", "emerson-basantes", "daniel-galarza", "juan-pablo-martinez", "jose-luis-gualotuna", "santiago-vivanco", "daniel-bastidas", "grace-cordero", "freddy-rivera", "estefania-garrido", "gabriela-gonzalez", "nelson-sanchez", "pablo-cando", "javier-izquierdo", "maria-fernanda-calvopina", "rodrigo-martinez", "sofia-vintimilla", "byron-espinosa", "carolina-calderon"];
      const foto = (k) => `assets/caras/${String(k).padStart(2, "0")}-${FOTOS[k - 1]}.jpg`;
      const fit = (txt, max, width, em) => Math.min(max, Math.floor(width / (txt.length * em)));
      CATS.forEach(([name, desc, a, b, na, nb], i) => {
        const t0 = TC + i * CD;
        const s = el("div", "scene");
        const cb = el("div", "catblock", `<div class="lab">CATEGORÍA ${String(i + 1).padStart(2, "0")}</div><div class="gold cin nm" style="font-size:${fit(name, 150, 1700, 0.84)}px">${name}</div>${desc ? `<div class="ita ds">(${desc})</div>` : ""}`);
        const nameSize = (t) => `font-size:${fit(t, 46, 560, 0.78)}px`;
        const L = el("div", "nom l", `<div class="ph"><div class="in"><img src="${foto(a)}" alt="" /></div></div><div class="name" style="${nameSize(na)}">${na}</div>`);
        const R = el("div", "nom r", `<div class="ph"><div class="in"><img src="${foto(b)}" alt="" /></div></div><div class="name" style="${nameSize(nb)}">${nb}</div>`);
        [L, R, cb].forEach((e) => s.appendChild(e));
        $("cats").appendChild(s);
        show(s, t0, t0 + CD);

        // 1 · Título de la categoría a pantalla completa
        blockIn(cb, t0 + 0.1);
        shine(cb.querySelector(".gold"), t0 + 0.8);
        // 2 · El título sube y quedan los nominados en grande
        tl.to(cb, { y: -160, scale: 0.6, duration: 0.9, ease: "power3.inOut" }, t0 + 2.8);
        tl.fromTo(L, { x: -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, t0 + 3.1);
        tl.fromTo(R, { x: 900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, t0 + 3.3);
        tl.to([L, R], { y: -8, duration: 3, ease: "sine.inOut" }, t0 + 4.3);
        // la estatuilla de turno cae sobre el QR
        const sv = statue($("statues"), i % 3, 960, 814, 290);
        tl.set(sv, { visibility: "hidden" }, 0);
        tl.set(sv, { visibility: "visible" }, t0 + 3.6);
        land(sv, t0 + 3.6);
        tl.to(sv, { y: -1200, duration: 0.5, ease: "power3.in" }, t0 + CD - 0.55);
        tl.set(sv, { visibility: "hidden" }, t0 + CD);
        tl.to(s, { opacity: 0, duration: 0.4 }, t0 + CD - 0.45);
      });

      /* ───── Cierre: QR grande 15 s ───── */
      show("#s-fin", TF);
      tl.fromTo("#qrbig", { y: 420, scale: 0.35, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, TF);
      blockIn("#fin-t", TF + 0.5);
      blockIn("#fin-s", TF + 0.8);
      shine("#fin-t", TF + 1.4);
      shine("#fin-t", TF + 7);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
