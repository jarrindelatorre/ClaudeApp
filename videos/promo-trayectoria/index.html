<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño (editable) ───────────── */
      :root {
        --bg: #121212;
        --text: #f4f1ec;
        --text-2: #a39e8f;
        --accent: #c8553d;
        --font-display: "Archivo", "Inter", system-ui, sans-serif;
        --display-stretch: 118%; /* ancho de la tipografía display (62%–125%) */
        --display-weight: 600;
        --bg-shade: 0.8; /* oscuridad del fondo fotográfico (0–1) */
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px; /* márgenes laterales */
        --col: 118px; /* ancho de columna (12 col) */
        --gutter: 24px;
        --radius: 4px;
        --title-size: 72px;
        --title-tracking: 0.02em;
      }

      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0;
        overflow: hidden;
        background: var(--bg);
        box-shadow: 0 -30px 80px rgba(0, 0, 0, 0.6);
      }
      /* Foto de fondo opaca (más grande que el cuadro para el parallax) */
      .bgl {
        position: absolute;
        left: -160px;
        top: -60px;
        width: 2240px;
        height: 1860px;
      }
      .bgl img {
        display: block;
        width: 2240px;
        height: 1240px;
        object-fit: cover;
        filter: grayscale(0.55) blur(1.5px);
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background:
          linear-gradient(90deg, rgba(18, 18, 18, 0.96) 0%, rgba(18, 18, 18, 0.82) 48%, rgba(18, 18, 18, 0.7) 100%),
          rgba(18, 18, 18, calc(var(--bg-shade) - 0.6));
      }
      .content,
      .layer-slow,
      .layer-fast {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* Encabezado de escena: "03 · MARCA" + línea fina */
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 104px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--accent);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--accent);
        transform-origin: left center;
      }

      /* Columna izquierda: 5 columnas (9 si la escena no tiene imágenes) */
      .left {
        position: absolute;
        left: var(--margin);
        top: 240px;
        width: calc(5 * var(--col) + 4 * var(--gutter));
      }
      .left.wide {
        width: calc(9 * var(--col) + 8 * var(--gutter));
      }
      .title {
        font: var(--display-weight) var(--title-size) / 1.02 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: var(--title-tracking);
        text-transform: uppercase;
        color: var(--text);
      }
      .title .line {
        display: block;
        overflow: hidden;
        padding-bottom: 6px;
      }
      .title .line span {
        display: block;
        transform-origin: left bottom;
      }
      .orgs {
        margin-top: 44px;
        color: var(--text);
        font: 500 26px/1.45 var(--font-body);
      }
      .skills {
        margin-top: 26px;
        color: var(--text-2);
        font: 400 21px/1.55 var(--font-body);
      }

      /* Columna derecha: 6 columnas, imágenes superpuestas */
      .right {
        position: absolute;
        left: calc(var(--margin) + 6 * (var(--col) + var(--gutter)));
        top: 210px;
        width: calc(6 * var(--col) + 5 * var(--gutter));
        height: 640px;
      }
      .shot {
        position: absolute;
        border-radius: var(--radius);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 4px 14px rgba(0, 0, 0, 0.35);
        background: #1d1d1d;
      }
      .shot .mask {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: var(--radius);
      }
      .shot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .shot.big {
        left: 0;
        top: 0;
        width: 640px;
        height: 450px;
      }
      .shot.small {
        right: 0;
        bottom: 0;
        width: 370px;
        height: 290px;
      }
      .shot.solo {
        left: 0;
        top: 40px;
        width: 828px;
        height: 540px;
      }

      /* 01 · Logo personal */
      .brand {
        position: absolute;
        left: var(--margin);
        top: 380px;
        width: 1300px;
      }
      .brand-logo {
        display: block;
        width: 1000px;
      }
      .brand-tag {
        margin-top: 48px;
        color: var(--text);
        font: 500 30px/1 var(--font-body);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .brand-url {
        margin-top: 22px;
        color: var(--accent);
        font: 500 20px/1 var(--font-body);
        letter-spacing: 0.22em;
      }

      /* 02 · Formación y visión */
      .edu-title-main {
        position: absolute;
        left: var(--margin);
        top: 200px;
        font: var(--display-weight) 72px / 1.02 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: var(--title-tracking);
        text-transform: uppercase;
      }
      .edu-title-main .line {
        display: block;
        overflow: hidden;
        padding-bottom: 6px;
      }
      .edu-title-main .line span {
        display: block;
        transform-origin: left bottom;
      }
      .edu {
        position: absolute;
        top: 420px;
        width: 700px;
      }
      .edu.a {
        left: var(--margin);
      }
      .edu.b {
        left: 1100px;
      }
      .edu-title {
        font: var(--display-weight) 42px / 1.16 var(--font-display);
        font-stretch: var(--display-stretch);
        color: var(--text);
      }
      .edu-school {
        margin-top: 24px;
        color: var(--text-2);
        font: 500 24px/1.45 var(--font-body);
      }
      .edu-rule {
        position: absolute;
        left: 959px;
        top: 400px;
        width: 2px;
        height: 290px;
        background: var(--accent);
        transform-origin: center top;
      }
      .edu-vision {
        position: absolute;
        left: var(--margin);
        top: 790px;
        width: 1680px;
        color: var(--text-2);
        font: 500 26px/1.4 var(--font-body);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Cierre */
      .outro {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .outro-logo {
        display: block;
        width: 760px;
      }
      .outro-url {
        margin-top: 56px;
        color: var(--text);
        font: 500 34px/1 var(--font-body);
        letter-spacing: 0.06em;
      }
      .outro-li {
        margin-top: 20px;
        color: var(--text-2);
        font: 400 22px/1 var(--font-body);
        letter-spacing: 0.04em;
      }

      /* Marca de agua (todas las escenas entre la 01 y el cierre) */
      #watermark {
        position: absolute;
        right: var(--margin);
        bottom: 72px;
        width: 200px;
        opacity: 0;
      }

      /* Viñeteado + grano muy sutil */
      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%);
        pointer-events: none;
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.07;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="56" data-track-index="0">
        <div id="scenes"></div>
        <img id="watermark" src="assets/jarrindelatorre-white.png" alt="" />
        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>

      <!-- Música: descomenta y apunta src a tu pista para agregarla.
      <audio id="music" src="assets/musica.mp3" data-start="0" data-duration="56" data-track-index="1" data-volume="0.6"></audio>
      -->
    </div>

    <script>
      /* ───────────── Contenido (editable) ───────────── */
      const LOGO = "assets/jarrindelatorre-white.png"; // logo Jarrín De la Torre (blanco)
      const IMG = "assets/";

      const SCENES = [
        {
          type: "brand",
          bg: "branding-comunica-ep.webp", // foto de fondo opaca
          duration: 5,
          tag: "Diseño · Comunicación · Tecnología",
          url: "jarrindelatorre.com",
        },
        {
          type: "education",
          bg: "branding-alpha-technologies.webp",
          duration: 6.5,
          kicker: "02 · Visión",
          title: ["Formación y visión"],
          items: [
            { title: "Máster en Diseño de Interfaces Multidispositivo UX/UI", school: "Escuela Superior de Diseño de Barcelona" },
            { title: "Máster en Inteligencia Artificial Aplicada", school: "Universidad de Las Américas, Quito" },
          ],
          vision: "Diseño multidisciplinario · Pensamiento estratégico · Enfoque humano",
        },
        {
          type: "area",
          bg: "branding-publica-fm.webp",
          duration: 5.5,
          kicker: "03 · Marca",
          title: ["Branding", "e identidad"],
          orgs: ["Comunica EP", "Koen", "Alpha Technologies"],
          skills: ["Creación de marcas", "Imagen corporativa", "Sistemas visuales", "Aplicaciones de marca"],
          images: ["branding-comunica-ep.webp", "branding-alpha-technologies.webp"],
        },
        {
          type: "area",
          bg: "branding-ecuador-tv.webp",
          duration: 5.5,
          kicker: "04 · Editorial",
          title: ["Diseño", "editorial e", "ilustración"],
          titleSize: 66,
          orgs: ["BID", "OIT", "Compassion International"],
          skills: ["Revistas", "Publicaciones", "Diagramación", "Cómics", "Ilustración"],
          images: ["editorial-yo-si-puedo-03.webp", "editorial-yo-si-puedo-01.webp"],
        },
        {
          type: "area",
          bg: "branding-publica-fm.webp",
          duration: 5.5,
          kicker: "05 · Audiovisual",
          title: ["Producción", "audiovisual"],
          orgs: ["Presidencia de la República del Ecuador", "Ecuador TV"],
          skills: ["Dirección de cámaras", "Realización", "Edición", "Postproducción"],
          images: ["branding-ecuador-tv.webp"],
        },
        {
          type: "area",
          bg: "branding-comunica-ep.webp",
          duration: 5.5,
          kicker: "06 · Digital",
          title: ["Diseño web y", "social media"],
          titleSize: 66,
          orgs: ["Comunica EP", "Koen", "Danny Ghosen", "El Ciudadano", "Ruta Viva"],
          skills: ["UX/UI", "Diseño web", "Figma", "HTML/CSS", "Contenidos digitales", "Gestión de redes"],
          images: ["koen-group-portada-web.webp", "danny-ghosen-portada-web.webp"],
        },
        {
          type: "area",
          bg: "branding-alpha-technologies.webp",
          duration: 5.5,
          kicker: "07 · Gestión",
          title: ["Dirección de", "proyectos"],
          orgs: ["Presidencia de la República", "Ruta Viva", "DAM", "Misión Metal"],
          skills: ["Coordinación de equipos", "Eventos", "Festivales", "Conciertos", "Campañas"],
          images: ["cartel-dam-desde-el-silencio.webp", "cartel-corovozandes.webp"],
        },
        {
          type: "area",
          bg: "branding-ecuador-tv.webp",
          duration: 5.5,
          kicker: "08 · Internacional",
          title: ["Proyectos", "internacionales"],
          titleSize: 56,
          orgs: ["The Tech Coup", "Festival Internacional de Música de Esmeraldas", "Belén La Radio"],
          skills: ["Coordinación", "Gestión de contenidos", "Traducción", "Comunicación intercultural", "Desarrollo digital"],
          images: ["thetechcoup-portada-web.webp", "belen-la-radio-portada-web.webp"],
        },
        {
          type: "area",
          bg: "branding-publica-fm.webp",
          duration: 5.5,
          kicker: "09 · Docencia",
          title: ["Docencia", "universitaria"],
          orgs: ["UDLA", "Pontificia Universidad Católica del Ecuador", "CEC de la Escuela Politécnica"],
          skills: ["Diseño gráfico", "Comunicación", "Interfaces UX/UI", "Actualización profesional", "Formación de nuevas generaciones"],
          images: [],
        },
        {
          type: "outro",
          bg: "branding-comunica-ep.webp",
          duration: 6,
          url: "jarrindelatorre.com",
          linkedin: "linkedin.com/in/dariojarrin",
        },
      ];

      /* ───────────── Timing y movimiento ───────────── */
      const EXIT = 0.5; // salida de la marca de agua
      const T = 1.3; // duración de la transición entre escenas
      const EASE = "expo.out";
      // Cada escena entra desde un lado distinto (alternando) y con un leve giro: el recorrido es curvo, no recto.
      const dirOf = (i) => (i % 2 ? 1 : -1);

      /* ───────────── Construcción del DOM ───────────── */
      const host = document.getElementById("scenes");
      const el = (tag, cls, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        return n;
      };
      const titleLines = (lines) => lines.map((l) => `<span class="line"><span>${l}</span></span>`).join("");
      const kicker = (text) => el("div", "kicker", `<span class="num">${text}</span><span class="rule"></span>`);

      let t0 = 0;
      SCENES.forEach((s, i) => {
        s.start = t0;
        t0 += s.duration;
        const scene = el("div", "scene");
        scene.id = `scene-${i}`;
        const bgl = el("div", "bgl");
        const bgImg = el("img");
        bgImg.src = IMG + s.bg;
        bgImg.alt = "";
        bgl.appendChild(bgImg);
        scene.appendChild(bgl);
        scene.appendChild(el("div", "shade"));
        const content = el("div", "content");
        // Dos capas de parallax: texto (lenta) e imágenes (rápida).
        const slow = el("div", "layer-slow");
        const fast = el("div", "layer-fast");
        content.appendChild(slow);
        content.appendChild(fast);
        scene.appendChild(content);

        if (s.type === "brand") {
          const b = el("div", "brand");
          const logo = el("img", "brand-logo");
          logo.src = LOGO;
          logo.alt = "";
          b.appendChild(logo);
          b.appendChild(el("div", "brand-tag", s.tag));
          b.appendChild(el("div", "brand-url", s.url));
          slow.appendChild(b);
        }

        if (s.type === "area") {
          slow.appendChild(kicker(s.kicker));
          const left = el("div", "left");
          if (!s.images.length) left.classList.add("wide");
          const title = el("div", "title", titleLines(s.title));
          if (s.titleSize) title.style.fontSize = `${s.titleSize}px`;
          left.appendChild(title);
          left.appendChild(el("div", "orgs", s.orgs.join(" · ")));
          left.appendChild(el("div", "skills", s.skills.join(" · ")));
          slow.appendChild(left);

          const right = el("div", "right");
          const kinds = s.images.length === 1 ? ["solo"] : ["big", "small"];
          s.images.forEach((src, j) => {
            const shot = el("div", `shot ${kinds[j]}`);
            const mask = el("div", "mask");
            const img = el("img");
            img.src = IMG + src;
            img.alt = "";
            mask.appendChild(img);
            shot.appendChild(mask);
            right.appendChild(shot);
          });
          fast.appendChild(right);
        }

        if (s.type === "education") {
          slow.appendChild(kicker(s.kicker));
          slow.appendChild(el("div", "edu-title-main", titleLines(s.title)));
          s.items.forEach((it, j) => {
            const b = el("div", `edu ${j ? "b" : "a"}`);
            b.appendChild(el("div", "edu-title", it.title));
            b.appendChild(el("div", "edu-school", it.school));
            fast.appendChild(b);
          });
          slow.appendChild(el("div", "edu-rule"));
          slow.appendChild(el("div", "edu-vision", s.vision));
        }

        if (s.type === "outro") {
          const o = el("div", "outro");
          const logo = el("img", "outro-logo");
          logo.src = LOGO;
          logo.alt = "";
          o.appendChild(logo);
          o.appendChild(el("div", "outro-url", s.url));
          o.appendChild(el("div", "outro-li", s.linkedin));
          slow.appendChild(o);
        }

        host.appendChild(scene);
      });

      /* ───────────── Animación ───────────── */
      const tl = gsap.timeline({ paused: true });
      const q = (scene, sel) => scene.querySelectorAll(sel);
      // Entrada de líneas de título: suben girando levemente desde la base, como una página que se asienta.
      const lineIn = (targets, at) =>
        tl.fromTo(targets, { yPercent: 110, rotation: 4, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.2, ease: EASE, stagger: 0.11 }, at);
      const riseIn = (targets, at, stagger = 0) =>
        tl.fromTo(targets, { opacity: 0, y: 26, x: -10 }, { opacity: 1, y: 0, x: 0, duration: 1.0, ease: EASE, stagger }, at);

      SCENES.forEach((s, i) => {
        const S = s.start;
        const E = s.start + s.duration;
        const scene = document.getElementById(`scene-${i}`);
        const last = i === SCENES.length - 1;
        const bgl = scene.querySelector(".bgl");
        const slow = scene.querySelector(".layer-slow");
        const fast = scene.querySelector(".layer-fast");
        const tin = i === 0 ? 0 : S - T / 2;
        const tend = last ? E : E + T / 2;
        const d = dirOf(i);
        const dn = dirOf(i + 1);

        tl.set(scene, { opacity: 1 }, tin);
        // Fondo: Ken Burns con deriva diagonal suave durante toda la escena.
        tl.fromTo(bgl.querySelector("img"), { scale: 1.16, x: 40 * d, y: 0 }, { scale: 1.02, x: -40 * d, y: -30, duration: tend - tin, ease: "sine.inOut" }, tin);

        if (i > 0) {
          // Entrada: la lámina llega en curva (desde abajo y un costado) con un leve giro que se endereza.
          tl.fromTo(scene, { y: 1080, x: 260 * d, rotation: 5 * d }, { y: 0, x: 0, rotation: 0, duration: T, ease: "power4.inOut", transformOrigin: "50% 100%" }, tin);
          tl.fromTo(bgl, { y: -620, x: -140 * d }, { y: 0, x: 0, duration: T, ease: "power4.inOut" }, tin);
          tl.fromTo(slow, { y: 380, x: 120 * d, rotation: 2.5 * d }, { y: 0, x: 0, rotation: 0, duration: T + 0.4, ease: EASE }, tin + 0.12);
          tl.fromTo(fast, { y: 760, x: 300 * d, rotation: -4 * d }, { y: 0, x: 0, rotation: 0, duration: T + 0.6, ease: "back.out(1.15)" }, tin + 0.22);
        }
        if (!last) {
          // Salida: las capas se separan en arco hacia el lado contrario, cada una a su ritmo.
          const tout = E - T / 2;
          tl.fromTo(bgl, { y: 0, x: 0 }, { y: -380, x: -160 * dn, duration: T, ease: "power3.inOut" }, tout);
          tl.fromTo(slow, { y: 0, x: 0, rotation: 0, opacity: 1 }, { y: -300, x: -180 * dn, rotation: -3 * dn, opacity: 0, duration: T * 0.85, ease: "power3.in" }, tout);
          tl.fromTo(fast, { y: 0, x: 0, rotation: 0, opacity: 1 }, { y: -640, x: -340 * dn, rotation: 5 * dn, opacity: 0, duration: T * 0.85, ease: "power3.in" }, tout);
          tl.set(scene, { opacity: 0 }, tend);
        }

        if (s.type === "brand") {
          tl.fromTo(q(scene, ".brand-logo"), { clipPath: "inset(0% 100% 0% 0%)", scale: 1.05, x: -30 }, { clipPath: "inset(0% 0% 0% 0%)", scale: 1, x: 0, duration: 1.6, ease: "expo.inOut" }, S + 0.2);
          riseIn(q(scene, ".brand-tag"), S + 1.2);
          riseIn(q(scene, ".brand-url"), S + 1.5);
          // Respiración continua del bloque: nunca queda quieto.
          tl.fromTo(q(scene, ".brand"), { x: 0, y: 0, rotation: 0 }, { x: -26, y: -10, rotation: -0.4, duration: tend - tin, ease: "sine.inOut" }, tin);
        }

        if (s.type === "area" || s.type === "education") {
          tl.fromTo(q(scene, ".kicker .rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.inOut" }, S + 0.05);
          tl.fromTo(q(scene, ".kicker .num"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.8, ease: EASE }, S + 0.1);
        }

        if (s.type === "area") {
          lineIn(q(scene, ".title .line span"), S + 0.3);
          riseIn(q(scene, ".orgs"), S + 0.95);
          riseIn(q(scene, ".skills"), S + 1.3);

          // Revelado con máscara de barrido + leve zoom-out; luego flotan en curvas suaves.
          q(scene, ".shot").forEach((shot, j) => {
            const at = S + 0.7 + j * 0.3;
            tl.fromTo(shot, { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.2, ease: "expo.inOut" }, at);
            tl.fromTo(shot.querySelector("img"), { scale: 1.1 }, { scale: 1, duration: 2.2, ease: "power2.out" }, at);
            tl.fromTo(
              shot,
              { y: 0, x: 0, rotation: 0 },
              { y: j ? 30 : -24, x: j ? -14 : 12, rotation: j ? 1.2 : -0.8, duration: s.duration + T, ease: "sine.inOut" },
              tin
            );
          });
          tl.fromTo(q(scene, ".left"), { x: 0, y: 0 }, { x: -20, y: -8, duration: s.duration + T, ease: "sine.inOut" }, tin);
        }

        if (s.type === "education") {
          lineIn(q(scene, ".edu-title-main .line span"), S + 0.3);
          tl.fromTo(q(scene, ".edu-rule"), { scaleY: 0 }, { scaleY: 1, duration: 1.1, ease: "expo.inOut" }, S + 0.5);
          riseIn(q(scene, ".edu-title"), S + 0.75, 0.25);
          riseIn(q(scene, ".edu-school"), S + 1.15, 0.25);
          riseIn(q(scene, ".edu-vision"), S + 1.7);
          tl.fromTo(q(scene, ".edu.a"), { x: 0, y: 0 }, { x: -18, y: 8, duration: s.duration + T, ease: "sine.inOut" }, tin);
          tl.fromTo(q(scene, ".edu.b"), { x: 0, y: 0 }, { x: 18, y: -8, duration: s.duration + T, ease: "sine.inOut" }, tin);
        }

        if (s.type === "outro") {
          tl.fromTo(q(scene, ".outro-logo"), { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 1.6, ease: "expo.inOut" }, S + 0.3);
          // Escala y deriva continuas hasta el último cuadro: el cierre respira, nunca se congela.
          tl.fromTo(q(scene, ".outro-logo"), { scale: 0.92, rotation: -0.6 }, { scale: 1.04, rotation: 0, duration: E - S - 0.3, ease: "sine.out" }, S + 0.3);
          riseIn(q(scene, ".outro-url"), S + 1.3);
          riseIn(q(scene, ".outro-li"), S + 1.6);
          tl.fromTo(q(scene, ".outro"), { y: 12 }, { y: -12, duration: E - S, ease: "sine.inOut" }, S);
        }
      });

      // Marca de agua discreta entre la escena 02 y el cierre.
      const wmIn = SCENES[1].start;
      const wmOut = SCENES[SCENES.length - 1].start;
      tl.fromTo("#watermark", { opacity: 0 }, { opacity: 0.5, duration: 0.6, ease: "power1.out" }, wmIn);
      tl.to("#watermark", { opacity: 0, duration: EXIT, ease: "power1.in" }, wmOut - EXIT);

      tl.set({}, {}, t0); // la línea de tiempo dura exactamente la suma de escenas
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
