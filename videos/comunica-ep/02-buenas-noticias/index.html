<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Comunica EP · Buenas noticias ───────────── */
      :root {
        --navy: #172d4c;
        --yellow: #f4ba1a;
        --font-big: "Oswald", "Archivo", sans-serif;
      }
      @font-face {
        font-family: "Oswald";
        src: url("assets/fonts/oswald-700.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 50%, rgba(14, 30, 52, 0.82) 0%, rgba(14, 30, 52, 0.55) 70%, rgba(14, 30, 52, 0.4) 100%);
      }
      #copy {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .line-wrap {
        overflow: hidden;
        padding: 0 20px;
      }
      .big {
        display: block;
        color: var(--yellow);
        font: 700 250px/1 var(--font-big);
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .rule {
        margin-top: 34px;
        width: 260px;
        height: 4px;
        background: var(--yellow);
      }
      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 25, 0.5) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.06;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="20" data-track-index="0">
        <div class="layer">
          <div class="bgl"><img src="assets/fondo-comunica.webp" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="copy" class="layer">
          <div class="line-wrap"><span class="big" id="w1">Buenas</span></div>
          <div class="line-wrap"><span class="big" id="w2">noticias</span></div>
          <div class="rule" id="rule"></div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      const DUR = 20;
      const EASE = "expo.out";
      const tl = gsap.timeline({ paused: true });

      /* Parallax lento del fondo */
      tl.fromTo(".bgl img", { scale: 1.1, x: 60, y: 0 }, { scale: 1, x: -80, y: -60, duration: DUR, ease: "sine.inOut" }, 0);

      /* Entrada del texto */
      tl.fromTo("#w1", { yPercent: 110, rotation: 3, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.6, ease: EASE }, 0.5);
      tl.fromTo("#w2", { yPercent: 110, rotation: 3, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.6, ease: EASE }, 0.9);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 1.8);
      tl.fromTo("#copy", { scale: 1 }, { scale: 1.04, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.2);

      /* Movimiento suave para hablar encima */
      tl.to("#copy", { scale: 1.05, y: -10, duration: DUR - 4.2, ease: "sine.inOut" }, 4.2);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
