<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño · serie El Telégrafo ───────────── */
      :root {
        --navy: #002c4f;
        --sky: #3aa6dd; /* azul de "CONECTADOS" */
        --yellow: #f4ba1a;
        --text: #f4f1ec;
        --font-slogan: "Oswald", "Archivo", sans-serif;
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px;
      }
      @font-face {
        font-family: "Oswald";
        src: url("assets/fonts/oswald-var.woff2") format("woff2");
        font-weight: 200 700;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* Fondo de ondas (capa más lenta) */
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(90deg, rgba(0, 24, 44, 0.9) 0%, rgba(0, 24, 44, 0.66) 45%, rgba(0, 24, 44, 0.5) 100%);
      }

      /* Encabezado */
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 104px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--yellow);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Slogan: CONECTADOS con El Telégrafo */
      .left {
        position: absolute;
        left: var(--margin);
        top: 0;
        height: 1080px;
        width: 700px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .line-wrap {
        overflow: hidden;
      }
      #slogan {
        display: block;
        color: var(--sky);
        font: 700 116px/1 var(--font-slogan);
        letter-spacing: 0.005em;
        white-space: nowrap;
        text-transform: uppercase;
      }
      #slogan .ch {
        display: inline-block;
      }
      #sub {
        display: block;
        margin-top: 10px;
        color: var(--text);
        font: 500 46px/1.15 var(--font-body);
        letter-spacing: 0.01em;
      }
      #rule-under {
        margin-top: 34px;
        width: 200px;
        height: 3px;
        background: var(--sky);
        transform-origin: left center;
      }

      /* Fotos grandes en collage */
      .photo {
        position: absolute;
        border: 8px solid #f4f1ec;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 40px 90px rgba(0, 10, 25, 0.6), 0 8px 20px rgba(0, 10, 25, 0.4);
        background: #0b2238;
      }
      .photo img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #p-mural {
        left: 820px;
        top: 160px;
        width: 800px;
        height: 450px;
        z-index: 1;
      }
      #p-notebook {
        left: 1030px;
        top: 540px;
        width: 440px;
        height: 459px;
        z-index: 2;
      }
      #p-rollup {
        left: 1500px;
        top: 96px;
        width: 340px;
        height: 818px;
        z-index: 3;
      }

      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 25, 0.5) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div id="layer-bg" class="layer">
          <div class="bgl"><img src="assets/fondo-ondas-2.png" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="layer-photos" class="layer">
          <div class="photo" id="p-mural"><img src="assets/mural-redaccion.webp" alt="" /></div>
          <div class="photo" id="p-notebook"><img src="assets/cuaderno-conectados.webp" alt="" /></div>
          <div class="photo" id="p-rollup"><img src="assets/rollup-decano-digital.webp" alt="" /></div>
        </div>

        <div id="layer-copy" class="layer">
          <div class="kicker"><span class="num">04 · Conectados</span><span class="rule"></span></div>
          <div class="left">
            <div class="line-wrap"><span id="slogan">Conectados</span></div>
            <div class="line-wrap"><span id="sub">con El Telégrafo</span></div>
            <div id="rule-under"></div>
          </div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      const DUR = 25; // duración total
      const ANIM = 10; // la animación principal ocurre en los primeros 10 s
      const EASE = "expo.out";
      const tl = gsap.timeline({ paused: true });

      // Letras del slogan por separado para animarlas una a una
      const slogan = document.getElementById("slogan");
      slogan.innerHTML = slogan.textContent.split("").map((c) => `<span class="ch">${c}</span>`).join("");

      /* Parallax: fondo lento, fotos y texto a su ritmo */
      tl.fromTo(".bgl img", { scale: 1.1, x: 60, y: 0 }, { scale: 1, x: -80, y: -60, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#layer-copy", { x: -160 }, { x: 0, duration: 2.0, ease: EASE }, 0);
      tl.fromTo(".left", { x: 0, y: 0 }, { x: -20, y: -8, duration: DUR, ease: "sine.inOut" }, 0);

      /* Slogan */
      tl.fromTo(".kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.3);
      tl.fromTo(".kicker .num", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 1.0, ease: EASE }, 0.4);
      tl.fromTo("#slogan .ch", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.1, ease: EASE, stagger: 0.06 }, 0.6);
      tl.fromTo("#sub", { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.2, ease: EASE }, 1.5);
      tl.fromTo("#rule-under", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 2.0);

      /* Fotos: cada una entra GRANDE en primer plano y luego se acomoda en el collage */
      // 1 · Mural de la redacción
      tl.fromTo("#p-mural", { x: 160, y: 120, scale: 1.25, rotation: 2, opacity: 0, zIndex: 5 }, { x: 160, y: 120, scale: 1.25, rotation: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, 1.8);
      tl.fromTo("#p-mural img", { scale: 1.15 }, { scale: 1.02, duration: DUR, ease: "sine.out" }, 1.8);
      tl.to("#p-mural", { x: 0, y: 0, scale: 1, rotation: -3, duration: 1.4, ease: "power3.inOut" }, 3.6);
      tl.set("#p-mural", { zIndex: 1 }, 5.0);
      // 2 · Roll-up "El decano digital"
      tl.fromTo("#p-rollup", { x: -380, y: 40, scale: 1.12, rotation: -4, opacity: 0, zIndex: 6 }, { x: -380, y: 40, scale: 1.12, rotation: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 4.0);
      tl.fromTo("#p-rollup img", { scale: 1.1 }, { scale: 1.02, duration: DUR, ease: "sine.out" }, 4.0);
      tl.to("#p-rollup", { x: 0, y: 0, scale: 1, rotation: 3, duration: 1.4, ease: "power3.inOut" }, 5.7);
      tl.set("#p-rollup", { zIndex: 3 }, 7.1);
      // 3 · Cuaderno "Conectados"
      tl.fromTo("#p-notebook", { x: 40, y: -160, scale: 1.45, rotation: 3, opacity: 0, zIndex: 7 }, { x: 40, y: -160, scale: 1.45, rotation: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 6.4);
      tl.fromTo("#p-notebook img", { scale: 1.1 }, { scale: 1.02, duration: DUR, ease: "sine.out" }, 6.4);
      tl.to("#p-notebook", { x: 0, y: 0, scale: 1, rotation: -4, duration: 1.4, ease: "power3.inOut" }, 8.1);
      tl.set("#p-notebook", { zIndex: 2 }, 9.5);

      /* De 10 a 25 s: el collage flota lentamente para hablar encima */
      tl.to("#p-mural", { x: -16, y: -14, rotation: -2.4, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);
      tl.to("#p-rollup", { x: 10, y: -20, rotation: 2.2, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);
      tl.to("#p-notebook", { x: -10, y: 16, rotation: -3, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
