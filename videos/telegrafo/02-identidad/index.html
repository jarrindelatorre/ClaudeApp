<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño · serie El Telégrafo ───────────── */
      :root {
        --navy: #002c4f;
        --logo-blue: #1b91bc;
        --teal: #35b9b8;
        --yellow: #f4ba1a;
        --text: #f4f1ec;
        --text-2: #b9c4d0;
        --font-display: "Archivo", "Inter", system-ui, sans-serif;
        --display-stretch: 118%;
        --display-weight: 600;
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* Fondo de ondas (capa más lenta) */
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(90deg, rgba(0, 24, 44, 0.9) 0%, rgba(0, 24, 44, 0.62) 50%, rgba(0, 24, 44, 0.35) 100%);
      }

      /* Encabezado */
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 104px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--yellow);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Texto: El reloj de la Torre es nuestra identidad */
      .left {
        position: absolute;
        left: var(--margin);
        top: 0;
        height: 1080px;
        width: 900px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .line-wrap {
        overflow: hidden;
        padding-bottom: 6px;
      }
      .line-wrap > * {
        display: block;
      }
      .title {
        color: var(--text);
        font: var(--display-weight) 72px / 1.04 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .label {
        margin-top: 26px;
        color: var(--text);
        font: 500 34px/1.3 var(--font-body);
      }
      .hero {
        color: var(--yellow);
        font: var(--display-weight) 100px / 1.02 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .rule-under {
        margin-top: 30px;
        width: 220px;
        height: 3px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Torre silueteada: el fondo se ve en movimiento alrededor */
      .tower {
        position: absolute;
        display: block;
        filter: drop-shadow(0 30px 50px rgba(0, 10, 25, 0.55));
      }
      #tower-detail {
        left: 1150px;
        top: 70px;
        width: 615px;
        height: 989px;
        transform-origin: 61% 55%;
      }

      /* Logo que se dibuja sobre la torre */
      #logo {
        position: absolute;
        left: 1390px;
        top: 290px;
        width: 470px;
        height: 434px;
        overflow: visible;
      }

      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 25, 0.5) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div id="layer-bg" class="layer">
          <div class="bgl"><img src="assets/fondo-ondas-2.png" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="layer-tower" class="layer">
          <img class="tower" id="tower-detail" src="assets/torre-reloj-detalle.png" alt="" />

          <!-- Logo de la Torre en vectores (original: assets/logo-torre.png, 1500×1385).
               Como en el original, la torre, la aguja y las manecillas son un RECORTE (transparente)
               en el círculo azul: a través de ellas se ve la foto de la torre. -->
          <svg id="logo" viewBox="0 0 1500 1385">
            <defs>
              <mask id="logo-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="1385">
                <rect x="0" y="0" width="1500" height="1385" fill="#fff" />
                <path id="m-tower" d="M343 1400 L343 692 L278 587 L421 571 C430 360 570 214 725 200 L765 200 C920 214 1060 360 1069 571 L1213 587 L1147 692 L1147 1400 Z" fill="#000" />
                <line id="m-spire" x1="745" y1="200" x2="745" y2="120" stroke="#000" stroke-width="40" stroke-linecap="round" />
                <path id="m-window" d="M689 575 L805 575 C808 480 790 420 747 392 C704 420 686 480 689 575 Z" fill="#fff" />
                <circle id="m-clock" cx="745" cy="1035" r="228" fill="#fff" />
                <polyline id="m-hands" points="751,903 751,1040 678,1113" fill="none" stroke="#000" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
              </mask>
              <clipPath id="logo-clip"><rect x="0" y="0" width="1500" height="1385" /></clipPath>
            </defs>
            <g clip-path="url(#logo-clip)">
              <!-- Relleno azul con el recorte de la torre -->
              <circle id="lg-circle-fill" cx="748" cy="748" r="740" fill="#1b91bc" mask="url(#logo-mask)" />
              <!-- Línea blanca que dibuja todo el logo poco a poco y luego desaparece -->
              <g id="lg-lines" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
                <circle id="ln-circle" cx="748" cy="748" r="740" transform="rotate(-90 748 748)" pathLength="1" stroke-dasharray="1 1" />
                <path id="ln-tower" d="M343 1400 L343 692 L278 587 L421 571 C430 360 570 214 725 200 L765 200 C920 214 1060 360 1069 571 L1213 587 L1147 692 L1147 1400" pathLength="1" stroke-dasharray="1 1" />
                <line id="ln-spire" x1="745" y1="200" x2="745" y2="120" pathLength="1" stroke-dasharray="1 1" />
                <path id="ln-window" d="M689 575 L805 575 C808 480 790 420 747 392 C704 420 686 480 689 575 Z" pathLength="1" stroke-dasharray="1 1" />
                <circle id="ln-clock" cx="745" cy="1035" r="228" transform="rotate(-90 745 1035)" pathLength="1" stroke-dasharray="1 1" />
                <polyline id="ln-hands" points="751,903 751,1040 678,1113" pathLength="1" stroke-dasharray="1 1" />
              </g>
            </g>
          </svg>
        </div>

        <div id="layer-copy" class="layer">
          <div class="kicker"><span class="num">02 · Identidad</span><span class="rule"></span></div>
          <div class="left">
            <div class="line-wrap"><span class="title" id="t1">El reloj</span></div>
            <div class="line-wrap"><span class="title" id="t2">de la Torre</span></div>
            <div class="label" id="lbl">es nuestra</div>
            <div class="line-wrap"><span class="hero" id="hero">identidad</span></div>
            <div class="rule-under" id="rule-under"></div>
          </div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      /* ───────────── Timing ───────────── */
      const DUR = 25; // duración total
      const ANIM = 11; // la animación principal ocurre en los primeros ~11 s
      const MOVE = 3.4; // la foto de la torre se desplaza a la izquierda
      const DRAW = 4.6; // empieza a dibujarse el logo a su derecha
      const EASE = "expo.out";

      const tl = gsap.timeline({ paused: true });
      const lineIn = (t, at) => tl.fromTo(t, { yPercent: 110, rotation: 4, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.5, ease: EASE }, at);
      const riseIn = (t, at) => tl.fromTo(t, { opacity: 0, y: 26, x: -10 }, { opacity: 1, y: 0, x: 0, duration: 1.3, ease: EASE }, at);
      const draw = (t, at, d) => tl.fromTo(t, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);

      /* Parallax: fondo lento, torre media, texto rápido */
      // Fondo desplazado a la izquierda: el logo queda sobre azul liso, sin ruido detrás.
      tl.fromTo(".bgl img", { scale: 1.05, x: -620, y: 0 }, { scale: 1, x: -720, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#layer-copy", { x: -160, y: 20, rotation: -0.8 }, { x: 0, y: 0, rotation: 0, duration: 2.0, ease: EASE }, 0);
      tl.fromTo(".left", { x: 0, y: 0 }, { x: -24, y: -10, duration: DUR, ease: "sine.inOut" }, 0);

      /* Texto */
      tl.fromTo(".kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.3);
      tl.fromTo(".kicker .num", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 1.0, ease: EASE }, 0.4);
      lineIn("#t1", 0.7);
      lineIn("#t2", 0.95);
      riseIn("#lbl", 2.0);
      lineIn("#hero", 2.4);
      tl.fromTo("#rule-under", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 3.0);

      /* 1 · La foto cercana de la torre sube desde abajo */
      tl.fromTo("#tower-detail", { y: 320, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 2.2, ease: EASE }, 0.4);
      /* 2 · La torre se desplaza a la izquierda para dejar sitio al logo */
      tl.to("#tower-detail", { x: -300, scale: 0.9, duration: 1.8, ease: "power3.inOut" }, MOVE);

      /* 3 · Se dibuja el logo junto a la torre: todo con línea blanca, poco a poco */
      draw("#ln-circle", DRAW, 1.6);
      draw("#ln-tower", DRAW + 0.9, 1.8);
      draw("#ln-spire", DRAW + 2.4, 0.4);
      draw("#ln-window", DRAW + 2.5, 0.8);
      draw("#ln-clock", DRAW + 2.8, 1.0);
      draw("#ln-hands", DRAW + 3.4, 0.6);
      // Luego entra el azul (con la torre recortada) y la línea blanca se desvanece: el logo final no tiene blanco.
      tl.fromTo("#lg-circle-fill", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.inOut" }, DRAW + 4.0);
      tl.to("#lg-lines", { opacity: 0, duration: 0.9, ease: "power1.inOut" }, DRAW + 4.3);
      tl.fromTo("#logo", { scale: 0.96 }, { scale: 1, duration: 1.2, ease: "back.out(1.6)" }, DRAW + 4.2);

      /* 4 · Al final la torre y el logo se separan más */
      const SPLIT = DRAW + 4.6;
      tl.to("#tower-detail", { x: -380, duration: 1.6, ease: "power3.inOut" }, SPLIT);
      tl.fromTo("#logo", { x: 0 }, { x: 50, duration: 1.6, ease: "power3.inOut" }, SPLIT);

      /* 5 · Flotación lenta hasta el final para hablar encima */
      tl.to("#tower-detail", { y: -24, scale: 0.93, duration: DUR - SPLIT - 1.6, ease: "sine.inOut" }, SPLIT + 1.6);
      tl.to("#logo", { y: -14, rotation: -1, duration: DUR - SPLIT - 1.6, ease: "sine.inOut" }, SPLIT + 1.6);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
