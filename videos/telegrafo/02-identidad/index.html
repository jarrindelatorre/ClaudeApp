<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* ───────────── Sistema de diseño · serie El Telégrafo ───────────── */
      :root {
        --navy: #002c4f;
        --logo-blue: #1b91bc;
        --teal: #35b9b8;
        --yellow: #f4ba1a;
        --text: #f4f1ec;
        --text-2: #b9c4d0;
        --font-display: "Archivo", "Inter", system-ui, sans-serif;
        --display-stretch: 118%;
        --display-weight: 600;
        --font-body: "Inter", system-ui, sans-serif;
        --margin: 120px;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-var.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--navy);
        color: var(--text);
        font-family: var(--font-body);
      }
      #stage,
      .layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }

      /* Fondo de ondas (capa más lenta) */
      .bgl {
        position: absolute;
        left: -100px;
        top: -40px;
        width: 2160px;
        height: 1440px;
      }
      .bgl img {
        display: block;
        width: 2160px;
        height: 1440px;
        object-fit: cover;
      }
      .shade {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(90deg, rgba(0, 24, 44, 0.9) 0%, rgba(0, 24, 44, 0.62) 50%, rgba(0, 24, 44, 0.35) 100%);
      }

      /* Encabezado */
      .kicker {
        position: absolute;
        left: var(--margin);
        top: 104px;
        display: flex;
        align-items: center;
        gap: 20px;
        color: var(--yellow);
        font: 500 18px/1 var(--font-body);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .kicker .rule {
        display: block;
        width: 120px;
        height: 1px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Texto: El reloj de la Torre es nuestra identidad */
      .left {
        position: absolute;
        left: var(--margin);
        top: 0;
        height: 1080px;
        width: 900px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .line-wrap {
        overflow: hidden;
        padding-bottom: 6px;
      }
      .line-wrap > * {
        display: block;
      }
      .title {
        color: var(--text);
        font: var(--display-weight) 72px / 1.04 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .label {
        margin-top: 26px;
        color: var(--text);
        font: 500 34px/1.3 var(--font-body);
      }
      .hero {
        color: var(--yellow);
        font: var(--display-weight) 100px / 1.02 var(--font-display);
        font-stretch: var(--display-stretch);
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .rule-under {
        margin-top: 30px;
        width: 220px;
        height: 3px;
        background: var(--yellow);
        transform-origin: left center;
      }

      /* Torre silueteada: el fondo se ve en movimiento alrededor */
      .tower {
        position: absolute;
        display: block;
        filter: drop-shadow(0 30px 50px rgba(0, 10, 25, 0.55));
      }
      /* Animación foto → icono (croma verde quitado, secuencia de 97 cuadros) */
      #morph {
        position: absolute;
        left: 1060px;
        top: 150px;
        width: 760px;
        height: 760px;
      }
      #morph img {
        position: absolute;
        inset: 0;
        width: 760px;
        height: 760px;
        opacity: 0;
      }

      #vignette {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 10, 25, 0.5) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0">
        <div id="layer-bg" class="layer">
          <div class="bgl"><img src="assets/fondo-ondas-2.png" alt="" /></div>
          <div class="shade"></div>
        </div>

        <div id="layer-tower" class="layer">
          <div id="morph"></div>
        </div>

        <div id="layer-copy" class="layer">
          <div class="kicker"><span class="num">02 · Identidad</span><span class="rule"></span></div>
          <div class="left">
            <div class="line-wrap"><span class="title" id="t1">El reloj</span></div>
            <div class="line-wrap"><span class="title" id="t2">de la Torre</span></div>
            <div class="label" id="lbl">es nuestra</div>
            <div class="line-wrap"><span class="hero" id="hero">identidad</span></div>
            <div class="rule-under" id="rule-under"></div>
          </div>
        </div>

        <div id="vignette"></div>
        <svg id="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="1920" height="1080" filter="url(#noise)" />
        </svg>
      </div>
    </div>

    <script>
      /* ───────────── Timing ───────────── */
      const DUR = 25; // duración total
      const ANIM = 11; // la animación principal ocurre en los primeros ~11 s
      const EASE = "expo.out";

      const tl = gsap.timeline({ paused: true });
      const lineIn = (t, at) => tl.fromTo(t, { yPercent: 110, rotation: 4, opacity: 0 }, { yPercent: 0, rotation: 0, opacity: 1, duration: 1.5, ease: EASE }, at);
      const riseIn = (t, at) => tl.fromTo(t, { opacity: 0, y: 26, x: -10 }, { opacity: 1, y: 0, x: 0, duration: 1.3, ease: EASE }, at);
      const draw = (t, at, d) => tl.fromTo(t, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, at);

      /* Parallax: fondo lento, torre media, texto rápido */
      // Fondo desplazado a la izquierda: el logo queda sobre azul liso, sin ruido detrás.
      tl.fromTo(".bgl img", { scale: 1.05, x: -620, y: 0 }, { scale: 1, x: -720, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
      tl.fromTo("#layer-copy", { x: -160, y: 20, rotation: -0.8 }, { x: 0, y: 0, rotation: 0, duration: 2.0, ease: EASE }, 0);
      tl.fromTo(".left", { x: 0, y: 0 }, { x: -24, y: -10, duration: DUR, ease: "sine.inOut" }, 0);

      /* Texto */
      tl.fromTo(".kicker .rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.3);
      tl.fromTo(".kicker .num", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 1.0, ease: EASE }, 0.4);
      lineIn("#t1", 0.7);
      lineIn("#t2", 0.95);
      riseIn("#lbl", 2.0);
      lineIn("#hero", 2.4);
      tl.fromTo("#rule-under", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 3.0);

      /* 1 · Foto de la torre → silueta → icono (secuencia sin fondo verde).
         Cada cuadro es una imagen; el timeline muestra solo el que corresponde (render determinista). */
      const N = 97, SEQ_START = 1.6, SEQ_DUR = 6.4; // la animación original (4 s) se reproduce más lenta
      const morph = document.getElementById("morph");
      const frames = [];
      for (let i = 0; i < N; i++) {
        const im = document.createElement("img");
        im.src = `assets/torre-croma/f${String(i).padStart(3, "0")}.png`;
        im.alt = "";
        morph.appendChild(im);
        frames.push(im);
      }
      const seq = { f: 0 };
      let shown = -1;
      const showFrame = () => {
        const k = Math.max(0, Math.min(N - 1, Math.round(seq.f)));
        if (k === shown) return;
        if (shown >= 0) frames[shown].style.opacity = 0;
        frames[k].style.opacity = 1;
        shown = k;
      };
      showFrame();
      tl.fromTo(seq, { f: 0 }, { f: N - 1, duration: SEQ_DUR, ease: "none", onUpdate: showFrame }, SEQ_START);
      // Entrada: la torre sube desde abajo; al final el icono respira con un leve pulso
      tl.fromTo("#morph", { y: 260, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 1.6, ease: EASE }, 0.3);
      tl.fromTo("#morph", { scale: 1 }, { scale: 1.04, duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, SEQ_START + SEQ_DUR);

      /* 2 · De 10 a 25 s: flotación lenta para hablar encima */
      tl.to("#morph", { y: -20, rotation: -1, duration: DUR - ANIM, ease: "sine.inOut" }, ANIM);

      tl.set({}, {}, DUR);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
